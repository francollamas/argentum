name: continuous integration

on:
  pull_request:
  push:
    branches: ['develop', 'main']

env:
  CLIENT_DIR: apps/client
  GODOT_VERSION: 4.7.0
  WEB_ARTIFACT_NAME: client-web-build
  VERCEL_DEPLOY_DIR: .vercel-deploy

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import Godot project
        run: godot --headless --path "${{ env.CLIENT_DIR }}" --import > godot-import.log 2>&1

      - name: Validate import log
        run: |
          if grep -E "SCRIPT ERROR|Parse Error" godot-import.log; then
            cat godot-import.log
            exit 1
          fi

      - name: Export Web build
        run: |
          rm -rf "${{ env.CLIENT_DIR }}/export/web"
          mkdir -p "${{ env.CLIENT_DIR }}/export/web"
          godot --headless --path "${{ env.CLIENT_DIR }}" --export-release "Web" "export/web/index.html"

      - name: Verify exported build
        run: |
          test -f "${{ env.CLIENT_DIR }}/export/web/index.html"
          test -f "${{ env.CLIENT_DIR }}/export/web/index.js"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WEB_ARTIFACT_NAME }}
          path: ${{ env.CLIENT_DIR }}/export

  deploy-preview:
    name: Deploy preview to Vercel
    if: ${{ github.event_name == 'pull_request' && github.head_ref != 'main' && github.head_ref != 'develop' && !github.event.pull_request.head.repo.fork }}
    needs: continuous-integration
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download web build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WEB_ARTIFACT_NAME }}
          path: ${{ env.CLIENT_DIR }}/export

      - name: Verify downloaded build
        run: |
          test -f "${{ env.CLIENT_DIR }}/export/web/index.html"
          test -f "${{ env.CLIENT_DIR }}/export/web/index.js"

      - name: Install Vercel
        run: npm install --global vercel@canary

      - name: Pull Vercel environment information
        working-directory: ${{ env.CLIENT_DIR }}
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Prepare Vercel deploy directory
        run: |
          rm -rf "${{ env.VERCEL_DEPLOY_DIR }}"
          mkdir -p "${{ env.VERCEL_DEPLOY_DIR }}/.vercel"
          cp "${{ env.CLIENT_DIR }}/vercel.json" "${{ env.VERCEL_DEPLOY_DIR }}/vercel.json"
          cp "${{ env.CLIENT_DIR }}/.vercel/project.json" "${{ env.VERCEL_DEPLOY_DIR }}/.vercel/project.json"
          cp -R "${{ env.CLIENT_DIR }}/export" "${{ env.VERCEL_DEPLOY_DIR }}/export"

      - name: Deploy project artifacts to Vercel
        working-directory: ${{ env.VERCEL_DEPLOY_DIR }}
        run: vercel deploy --yes --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}

  deploy-production:
    name: Deploy production to Vercel
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    needs: continuous-integration
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production-${{ github.ref }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download web build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WEB_ARTIFACT_NAME }}
          path: ${{ env.CLIENT_DIR }}/export

      - name: Verify downloaded build
        run: |
          test -f "${{ env.CLIENT_DIR }}/export/web/index.html"
          test -f "${{ env.CLIENT_DIR }}/export/web/index.js"

      - name: Install Vercel
        run: npm install --global vercel@canary

      - name: Pull Vercel environment information
        working-directory: ${{ env.CLIENT_DIR }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Prepare Vercel deploy directory
        run: |
          rm -rf "${{ env.VERCEL_DEPLOY_DIR }}"
          mkdir -p "${{ env.VERCEL_DEPLOY_DIR }}/.vercel"
          cp "${{ env.CLIENT_DIR }}/vercel.json" "${{ env.VERCEL_DEPLOY_DIR }}/vercel.json"
          cp "${{ env.CLIENT_DIR }}/.vercel/project.json" "${{ env.VERCEL_DEPLOY_DIR }}/.vercel/project.json"
          cp -R "${{ env.CLIENT_DIR }}/export" "${{ env.VERCEL_DEPLOY_DIR }}/export"

      - name: Deploy project artifacts to Vercel
        working-directory: ${{ env.VERCEL_DEPLOY_DIR }}
        run: vercel deploy --yes --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }}
