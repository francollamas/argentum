name: continuous integration

on:
    pull_request:
    push:
        branches: ['develop', 'main']

defaults:
    run:
        working-directory: apps/client

jobs:
    continuous-integration:
        runs-on: ubuntu-22.04

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - name: setup node
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: pnpm
                  cache-dependency-path: apps/client/pnpm-lock.yaml

            - name: install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Install Linux dependencies for FastPack
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            - name: Install FastPack
              run: cargo install fastpack --version 0.29.4

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate assets
              run: pnpm run generate-assets

            - name: Build
              run: pnpm run build

            - name: Test
              run: pnpm test

            - name: Linter and Format
              run: pnpm run linter-check
