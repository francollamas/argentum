name: continuous integration

on:
  pull_request:
  push:
    branches: ['develop', 'main']

env:
  CLIENT_DIR: apps/client
  GODOT_VERSION: 4.7.0

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Verify Godot plugin dependency
        run: test -f "${{ env.CLIENT_DIR }}/addons/godot_ai/plugin.cfg"

      - name: Import Godot project
        run: godot --headless --path "${{ env.CLIENT_DIR }}" --import > godot-import.log 2>&1

      - name: Validate import log
        run: |
          if grep -E "SCRIPT ERROR|Parse Error" godot-import.log; then
            cat godot-import.log
            exit 1
          fi

      - name: Export Web build
        run: |
          rm -rf "${{ env.CLIENT_DIR }}/export/web"
          mkdir -p "${{ env.CLIENT_DIR }}/export/web"
          godot --headless --path "${{ env.CLIENT_DIR }}" --export-release "Web" "export/web/index.html"

      - name: Verify exported build
        run: |
          test -f "${{ env.CLIENT_DIR }}/export/web/index.html"
          test -f "${{ env.CLIENT_DIR }}/export/web/index.js"
