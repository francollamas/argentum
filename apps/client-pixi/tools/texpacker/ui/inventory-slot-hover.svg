      <stop offset="0%" style="stop-color:#3E2920;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C1A14;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="slotHoverBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C28A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F2D059;stop-opacity:1" />
