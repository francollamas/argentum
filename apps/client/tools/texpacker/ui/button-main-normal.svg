  <rect x="4" y="4" width="392" height="92" rx="8" fill="url(#buttonMainBg)" stroke="url(#buttonMainBorder)" stroke-width="4"/>
  <rect x="6" y="6" width="388" height="88" rx="7" fill="url(#buttonMainHighlight)" stroke="none"/>
