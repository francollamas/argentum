  <rect x="2" y="2" width="146" height="46" fill="url(#buttonMainBg)" stroke="url(#buttonMainBorder)" stroke-width="2"/>
  <rect x="3" y="3" width="144" height="44" fill="url(#buttonMainHighlight)" stroke="none"/>
