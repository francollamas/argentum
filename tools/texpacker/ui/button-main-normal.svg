<svg xmlns="http://www.w3.org/2000/svg" width="150" height="50" viewBox="0 0 150 50">
  <defs>
    <linearGradient id="buttonMainBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4752F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B85F1F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9A4A1A;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="buttonMainBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A679;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A87D5A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A5538;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="buttonMainHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.2" />
    </linearGradient>
