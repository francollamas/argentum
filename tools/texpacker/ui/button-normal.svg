<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>

    <linearGradient id="buttonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#357ABD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E5A8A;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="buttonBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A4C2F4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7B9CCF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A6B8A;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="buttonHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="92" height="92" rx="6" fill="url(#buttonBg)" stroke="url(#buttonBorder)" stroke-width="4"/>
  <rect x="6" y="6" width="88" height="88" rx="5" fill="url(#buttonHighlight)" stroke="none"/>
</svg>
