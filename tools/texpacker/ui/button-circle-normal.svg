<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <defs>
    <linearGradient id="buttonCircleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4752F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B85F1F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9A4A1A;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="buttonCircleBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A679;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A5538;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="buttonCircleHighlight" x1="0%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <circle cx="25" cy="25" r="23" fill="url(#buttonCircleBg)" stroke="url(#buttonCircleBorder)" stroke-width="2"/>
  <ellipse cx="25" cy="10" rx="15" ry="8" fill="url(#buttonCircleHighlight)" stroke="none"/>
</svg>
