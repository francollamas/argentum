<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <defs>
    <linearGradient id="slotBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2C1A14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0F0B;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="slotBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7A503A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B38A6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A503A;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="slotInnerShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="46" height="46" rx="2" fill="url(#slotBg)" stroke="url(#slotBorder)" stroke-width="2"/>
  <rect x="3" y="3" width="44" height="20" rx="1" fill="url(#slotInnerShadow)" stroke="none"/>
</svg>
