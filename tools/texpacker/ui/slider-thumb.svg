<svg xmlns="http://www.w3.org/2000/svg" width="20" height="28" viewBox="0 0 20 28">
  <defs>
    <linearGradient id="thumbBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A86A3C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B4D2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#603522;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="thumbBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C28A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B38A6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A503A;stop-opacity:1" />
    </linearGradient>

    <filter id="thumbShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="16" height="24" rx="2" fill="url(#thumbBg)" stroke="url(#thumbBorder)" stroke-width="1.5" filter="url(#thumbShadow)"/>
  <line x1="7" y1="10" x2="7" y2="18" stroke="#7A503A" stroke-width="1" stroke-linecap="round"/>
  <line x1="10" y1="10" x2="10" y2="18" stroke="#7A503A" stroke-width="1" stroke-linecap="round"/>
  <line x1="13" y1="10" x2="13" y2="18" stroke="#7A503A" stroke-width="1" stroke-linecap="round"/>
</svg>
