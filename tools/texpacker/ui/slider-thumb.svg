<svg xmlns="http://www.w3.org/2000/svg" width="48" height="67" viewBox="0 0 48 67">
  <defs>
    <linearGradient id="thumbBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A86A3C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B4D2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#603522;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="thumbBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C28A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B38A6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A503A;stop-opacity:1" />
    </linearGradient>

    <filter id="thumbShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="5" y="5" width="38" height="57" rx="5" fill="url(#thumbBg)" stroke="url(#thumbBorder)" stroke-width="3" filter="url(#thumbShadow)"/>
  <line x1="17" y1="24" x2="17" y2="43" stroke="#7A503A" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="24" y2="43" stroke="#7A503A" stroke-width="2" stroke-linecap="round"/>
  <line x1="31" y1="24" x2="31" y2="43" stroke="#7A503A" stroke-width="2" stroke-linecap="round"/>
</svg>
