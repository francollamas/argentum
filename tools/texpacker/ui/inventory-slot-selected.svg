<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <defs>
    <linearGradient id="slotSelectedBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3E2920;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C1A14;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="slotSelectedBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F2D059;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFE8B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F2D059;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="slotSelectedInnerShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1" />
    </linearGradient>

    <filter id="slotSelectedGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="46" height="46" rx="2" fill="url(#slotSelectedBg)" stroke="url(#slotSelectedBorder)" stroke-width="3" filter="url(#slotSelectedGlow)"/>
  <rect x="3" y="3" width="44" height="44" rx="1" fill="url(#slotSelectedInnerShadow)" stroke="none"/>
</svg>
