<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="circleBg">
      <stop offset="0%" style="stop-color:#3E2920;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0F0B;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="circleBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C28A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B38A6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A503A;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="innerShadow">
      <stop offset="70%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.3" />
    </radialGradient>
  </defs>

  <circle cx="50" cy="50" r="46" fill="url(#circleBg)" stroke="url(#circleBorder)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="46" fill="url(#innerShadow)" stroke="none"/>
</svg>
