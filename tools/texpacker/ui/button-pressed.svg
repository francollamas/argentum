<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <defs>
    <linearGradient id="buttonPressedBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4A1F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9A4A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B85F1F;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="buttonPressedBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A87D5A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A679;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0B87C;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="buttonPressedShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="46" height="46" rx="3" fill="url(#buttonPressedBg)" stroke="url(#buttonPressedBorder)" stroke-width="2"/>
  <rect x="3" y="3" width="44" height="44" rx="2.5" fill="url(#buttonPressedShadow)" stroke="none"/>
</svg>
